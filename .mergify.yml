commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = sandbox-builder[bot]
queue_rules:
  - name: default
    batch_size: 1
    allow_inplace_checks: false
    max_checks_retries: 0
    merge_method: merge
    queue_conditions:
      - "check-success=02 tests"
      - "check-success=jstack/lock"
    merge_conditions:
      - "check-success=02 tests"
      - "check-success=jstack/holdouts"
